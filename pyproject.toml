[build-system]
requires = ["hatchling>=1.20.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "labelpro"
description = "Image annotation tool with batch keypoint management."
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
authors = [{ name = "ZiChen-Whisper" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "imgviz>=2.0.0",
  "loguru>=0.7",
  "matplotlib>=3.7",
  "natsort>=7.1.0",
  "numpy>=1.24",
  "onnxruntime>=1.23.2",
  "osam>=0.4.0",
  "pillow>=2.8",
  "pyside6>=6.8",
  "scipy>=1.8",
  "scikit-image>=0.21",
  "tifffile>=2024.1.30",
  "ruamel-yaml>=0.18",
]
dynamic = ["readme", "version"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[dependency-groups]
dev = [
  "ipython",
  "pytest>=8.3.4",
  "pytest-cov>=7.1.0",
  "pytest-qt>=4.4.0",
  "pytest-xdist>=3.8.0",
  "ruff~=0.12.11",
]

[project.scripts]
labelpro = "labelme.__main__:main"

[tool.pytest.ini_options]
addopts = "-m 'not network'"
qt_api = "pyside6"
markers = [
  "gui: mark a test as a GUI test.",
  "network: mark a test that accesses an external network service.",
]

[tool.ruff.lint]
select = [
  "ANN", # flake8-annotations
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
]
ignore = ["UP040"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
